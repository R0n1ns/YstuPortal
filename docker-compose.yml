version: "3.8"

services:
  web:
    image: nginx:alpine
    container_name: ystu-web
    ports:
      - "8081:80"
    volumes:
      - ./packages/web:/usr/share/nginx/html:ro
      - ./packages/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    image: postgres:13.3
    environment:
      POSTGRES_DB: "ystu_db"
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "user"
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: go-app

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://user:user@postgres:5432/ystu_db?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PORT: ${PORT:-8080}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}

    depends_on:
      - postgres
      - redis

    restart: unless-stopped
