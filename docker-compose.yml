version: "3.8"

services:
  web:
    image: nginx:alpine
    container_name: ystu-web
    ports:
      - "8081:80"
    volumes:
      - ./packages/web:/usr/share/nginx/html:ro
      - ./packages/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    image: postgres:13.3
    environment:
      POSTGRES_DB: "ystu_db"
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "user"
    ports:
      - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: go-app

    ports:
      - "8080:8080"

    environment:
      DATABASE_URL: "postgres://user:user@postgres:5432/ystu_db?sslmode=disable"

    depends_on:
      - postgres

    restart: unless-stopped
