services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ystu_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ystu_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    image: ystuportal:local
    command: ["/app/migrate", "-path", "/app/migrations", "-direction", "up"]
    environment:
      DATABASE_URL: postgres://user:user@postgres:5432/ystu_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    image: ystuportal:local
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEMO_MODE: ${DEMO_MODE:-true}
      PORT: 8080
      DATABASE_URL: postgres://user:user@postgres:5432/ystu_db?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_TTL: ${JWT_TTL:-24h}
      JWT_ISSUER: ${JWT_ISSUER:-ystuportal}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ystuportal-web}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ./packages/web:/usr/share/nginx/html:ro
      - ./packages/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres-data:
