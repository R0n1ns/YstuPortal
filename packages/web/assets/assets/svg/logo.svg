<svg width="600" height="150" viewBox="0 0 600 150" xmlns="http://www.w3.org/2000/svg">
    <style>
        .text { font-family: Arial, sans-serif; font-weight: bold; }
    </style>

    <!-- Иконка (упрощённая векторизация) -->
    <g transform="translate(10,20)" fill="#ff6a00">
        <!-- Буква Я (стилизованная) -->
        <path d="M60 20
             C30 20, 20 40, 40 55
             C20 65, 20 90, 50 90
             L65 90
             L65 70
             L55 70
             C40 70, 40 55, 55 55
             L65 55
             L65 20 Z"/>

        <!-- Календарь -->
        <rect x="70" y="20" width="60" height="50" rx="8"/>
        <rect x="80" y="10" width="8" height="15" rx="3"/>
        <rect x="110" y="10" width="8" height="15" rx="3"/>

        <!-- Галочка -->
        <path d="M80 45 L95 60 L120 30" stroke="white" stroke-width="5" fill="none"/>

        <!-- Часы -->
        <circle cx="115" cy="75" r="15" fill="#ff6a00"/>
        <line x1="115" y1="75" x2="115" y2="65" stroke="white" stroke-width="3"/>
        <line x1="115" y1="75" x2="123" y2="75" stroke="white" stroke-width="3"/>
    </g>

    <!-- Текст -->
    <text x="160" y="90" font-size="60" class="text" fill="#ff6a00">
        Расписание
    </text>
</svg>